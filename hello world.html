<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f3" />
    <title>Hello, world!</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f3;
        --text: #292a29;
        --muted: #777873;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #191a19; --text: #f1f1ee; --muted: #b4b5af; }
      }
      * { box-sizing: border-box; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; background: var(--bg); color: var(--text); }
      main { width: min(100%, 620px); }
      h1 { margin: 0 0 12px; font-size: clamp(40px, 8vw, 64px); line-height: 1.08; letter-spacing: -.05em; }
      p { margin: 0; color: var(--muted); font-size: 18px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello, world!</h1>
      <p>This is your page. Start changing it into something of your own.</p>
    </main>
  </body>
</html>
