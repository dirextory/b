<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f3" />
    <title>Your Name — Portfolio</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f6f3;
        --text: #292a29;
        --muted: #777873;
        --line: #e4e2de;
        --accent: #386b55;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #191a19; --text: #f1f1ee; --muted: #b4b5af; --line: #393a38; --accent: #a5d0b7; }
      }
      * { box-sizing: border-box; }
      body { max-width: 760px; margin: 0 auto; padding: 64px 24px; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.6; }
      h1 { margin: 0; font-size: clamp(40px, 8vw, 60px); line-height: 1.08; letter-spacing: -.05em; }
      h2 { margin: 0 0 14px; font-size: 18px; }
      .intro { max-width: 560px; margin: 14px 0 42px; color: var(--muted); font-size: 18px; }
      .projects { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
      .projects li { padding: 18px 0; border-bottom: 1px solid var(--line); }
      .project-link { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--text); font-size: 17px; font-weight: 650; text-decoration: none; }
      .project-link:hover, .contact a:hover { color: var(--accent); }
      .project-link:focus-visible, .contact a:focus-visible { outline: 3px solid #2783de; outline-offset: 3px; }
      .project-link svg { width: 17px; height: 17px; flex: 0 0 auto; color: var(--muted); }
      .projects p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
      .contact { margin-top: 34px; }
      .contact a { color: var(--text); text-underline-offset: 4px; }
      @media (max-width: 520px) { body { padding: 44px 20px; } .intro { margin-bottom: 34px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Your Name</h1>
      <p class="intro">I make thoughtful things for the web. This is a little home for my work.</p>
      <section aria-labelledby="projects-heading">
        <h2 id="projects-heading">Selected work</h2>
        <ul class="projects">
          <!-- Replace the sample project names, links, and descriptions. -->
          <li>
            <a class="project-link" href="https://example.com/project-one">Project one
              <svg class="lucide lucide-arrow-up-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
            </a>
            <p>A short sentence about what you made.</p>
          </li>
          <li>
            <a class="project-link" href="https://example.com/project-two">Project two
              <svg class="lucide lucide-arrow-up-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg>
            </a>
            <p>Another short sentence about a project.</p>
          </li>
        </ul>
      </section>
      <p class="contact"><a href="mailto:you@example.com">Get in touch</a></p>
    </main>
  </body>
</html>
